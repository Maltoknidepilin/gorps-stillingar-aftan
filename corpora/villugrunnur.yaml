description:
  fao: <p>Villugrunnur er ein málgrunnur við skeivum og rættaðum teksti. Tað var Uni
    Johannesen, sum byrjaði upp á villugrunnin í sambandi við masterritgerð sína í
    2024. Birita Dal-Christiansen helt fram við at rættlesa og villumerkja fleiri
    stílar. Savnið fevnir um 137 rættlisnar stílar, harav 103 eisini eru villumerktir.
    Tekstirnir vórðu innsamlaðir í novembur 2022. Í MMG eru bert rættlisnu tekstirnir
    tiknir við. Talan er ikki um tekstir í upprunalíki, tí teir eru rættlisnir, men
    orðaval er í mest møguligan mun varðveitt. Kyn, aldursbólkur og málførisøki eru
    knýtt at hvørjum stíli.</p>
  eng: '<p>Villugrunnur is an error corpus started by Uni Johannesen for his Master''s
    thesis in 2024. Birita Dal-Christiansen continued correcting and annotating further
    essays. The collection contains 137 manually corrected essays, of which 103 also
    have error annotations. The texts were collected in November 2022. MMG includes
    only the corrected text. These are not the texts in their original form: they
    have been corrected, while preserving word choice as far as possible. Gender,
    age group and dialect area are associated with each essay.</p>'
license:
