description:
  fao: |-
    <p>Teldutøka tekstasavn Føroyamálsdeildarinnar (TTF) er eitt fjølbroytt savn av føroyskum tekstum úr eitt nú heimasíðum, bókum, bløðum, útvarps- og sjónvarpstilfari, greinum og almennum frágreiðingum. Keldurnar eru bæði stovnar, feløg, miðlar og einstaklingar. Hendan útgávan er ein reinsað útgáva, har endurtøkur eru tiknar burtur. Málgrunnurin fevnir ikki um alt tilfarið í upprunaliga savninum.
    Í Korp verða setningarnir blandaðir tilvildarliga.</p>
  eng: |-
    <p>The Digital Corpus of the Faculty of Faroese (TTF) is a varied collection of Faroese texts from websites, books, newspapers, radio and television material, articles and public reports, among other sources. Its contributors include institutions, organisations, media outlets and individuals. This edition is a cleaned and deduplicated subset and does not contain all material from the original collection.
    In Korp, the sentences are shuffled.</p>
