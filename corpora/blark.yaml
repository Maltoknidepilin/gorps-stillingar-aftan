description:
  eng: |-
    <p><a href="https://aclanthology.org/2022.lrec-1.495/">BLARK</a> is the Faroese background-text corpus in the Basic Language Resource Kit, collected for language technology and especially automatic speech recognition.</p>
    <p>Its sources include University of the Faroe Islands articles and ministry reports, BirkBlog, Dimmalætting, FTS (the Faroese text collection at Språkbanken, mainly Dimmalætting 1998), Sosialurin, KVF, Portalurin, Ravnfacorpus (web pages, newspaper material and literary fiction collected by Sjúrður Gullbein in 2000–2001), and material from MEGD, Starvsblaðið and Statistics Faroe Islands. The texts span several genres and sources and have been cleaned and linguistically annotated in MMG. Text that is also present in other corpora in MMG-2026 has been removed from this one.</p>
  fao: |-
    <p><a href="https://aclanthology.org/2022.lrec-1.495/">BLARK</a> er føroyska bakgrundstekstasavnið í Basic Language Resource Kit, savnað til máltøkni og serliga talukenning.</p>
    <p>Tilfarið fevnir um greinar frá Fróðskaparsetrinum og frágreiðingar frá aðalráðum, BirkBlog, Dimmalætting, FTS (føroyskt tekstasavn hjá Språkbanken, serliga Dimmalætting 1998), Sosialin, KVF, Portalin, Ravnfacorpus (vevtekstir, blaðtilfar og skaldskapur savnað av Sjúrði Gullbein í 2000–2001) og tilfar frá MEGD, Starvsblaðnum og Hagstovuni. Tekstirnir eru savnaðir úr ymiskum tekstasløgum og keldum og eru reinsaðir og málsliga frámerktir í MMG. Tilfar, sum finst í øðrum málgrunnum í MMG-2026 er strikað úr hesum.</p>
