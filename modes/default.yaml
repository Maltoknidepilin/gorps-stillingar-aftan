
label:
  eng: Default
  fao: Alt

folders:
  uppslagsverk:
    title:
      fao: Uppslagsverk
      eng: Reference works
    description:
      fao: Alfrøðiligar greinar og tekstir úr orðabókum.
      eng: Encyclopedia articles and texts from dictionaries.

  yrkis:
    title:
      fao: Yrkisbókmentir
      eng: Nonfiction literature
    description:
      fao: Yrkisbøkur, vísindaligar greinir, kanningar og aðrir yrkistekstir.
      eng: Nonfiction books, academic articles, studies and other nonfiction texts.

  tidarrit:
    title:
      fao: Tíðarrit
      eng: Journals and report series
    description:
      fao: Ymisk vísindalig tíðarrit. Sí keldu- og nýtsluupplýsingar hjá einstøku søvnunum.
      eng: Various scientific journals. See each collection for sources and terms of use.

  atrunadur:
    title:
      fao: Átrúnaðarligir tekstir
      eng: Religious texts
    description:
      fao: Bíbliutýðingar og aðrir átrúnaðarligir tekstir. Sí upplýsingar og nýtslutreytir hjá einstøku søvnunum.
      eng: Bible translations and other religious texts. See each collection for details and terms of use.

  stilar:
    title:
      fao: Stílar
      eng: Essays
    description:
      fao: Stílar frá miðnámsskúlanæmingum. Síggj einstøku málgrunnarnar fyri kunning um nýtslutreytir.
      eng: Essays by upper-secondary students. See the individual corpora for their terms of use.

  talad-mal:
    title:
      fao: Talað mál
      eng: Spoken language
    description:
      fao: Sjálvvirkandi avskriving av talaðum máli. Ein talukennari er brúktur til at fáa talaða málið skrivað
        niður. Gev tí gætur, at teksturin kann innihalda orð, sum ikki eru til.
      eng: Automatic transcription of spoken language using speech recognition. Be aware that the text may
        contain words that do not exist.

  bundid-mal:
    description:
      fao: Kvæði, yrkingar og annað bundið mál.
      eng: Ballads, poems and other verse.
    title:
      fao: Bundið mál
      eng: Poetry

  almenn-kunning:
    description:
      fao: >-
        Reinsaður, dedupliseraður og málsliga frámerktur tekstur frá føroyskum
        almennum heimasíðum. Tilfarið er savnað í samstarvi við
        <a href="https://trustllm.eu/">TrustLLM</a> og
        <a href="https://giellatekno.uit.no/">Giellatekno</a>.
      eng: >-
        Cleaned, deduplicated and linguistically annotated text from Faroese
        public-sector websites. Collected in collaboration with
        <a href="https://trustllm.eu/">TrustLLM</a> and
        <a href="https://giellatekno.uit.no/">Giellatekno</a>.
    license:
      fao: >-
        <a href="https://logir.fo/Logtingslog/30-fra-30-04-2015-um-upphavsraett">Almenn skjøl - upphavsrættarlógin § 9</a>
      eng: >-
        <a href="https://logir.fo/Logtingslog/30-fra-30-04-2015-um-upphavsraett">Official documents - Faroese Copyright Act, section 9</a>
    title:
      fao: Almenn kunning
      eng: Public-sector information

  logir:
    description:
      fao: Føroysk rættarskjøl úr logir.fo, reinsað og málsliga frámerkt til leitingar.
      eng: Faroese legal documents from logir.fo, cleaned and linguistically annotated for searching.
    license:
      fao: <a href="https://logir.fo/Logtingslog/30-fra-30-04-2015-um-upphavsraett">Almenn skjøl - upphavsrættarlógin
        § 9</a>. Sjálvstøðug íkast kunnu vera vard. <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0
        1.0</a> fevnir bert um møgulig egin metadata- og dátugrunnsíkast frá <a href="https://www.usable.dev/">Usable</a>.
      eng: <a href="https://logir.fo/Logtingslog/30-fra-30-04-2015-um-upphavsraett">Official documents - Faroese
        Copyright Act, section 9</a>. Independent contributions may be protected. <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0
        1.0</a> covers only any original metadata and database contributions from <a href="https://www.usable.dev/">Usable</a>.
    title:
      fao: Lógir
      eng: Laws

hidden: true
